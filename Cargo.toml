[package]
name = "bashless"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Shell scripting without writing bash — a dax-style Rust library with mockable, testable commands."

[dependencies]
xshell = "0.2.7"
deno_task_shell = "=0.33.3"
futures = "0.3"
tokio = { version = "1", features = ["rt"] }